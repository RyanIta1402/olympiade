    let state = {
      lang: 'id',
      mode: 'review',
      filter: 'all',
      solTab: 'all',
      stepMode: 'all',
      mobileView: 'split',
      currentIdx: 0,
      showSolutions: true,
      userAnswers: {},
      visibleStepsCount: {},
      timerSeconds: 1500,
      timerInterval: null
    };

    function toggleDark() {
      document.documentElement.classList.toggle('dark');
    }

    function setMobileView(v) {
      state.mobileView = v;
      if (v === 'solution') state.showSolutions = true;
      render();
    }

    function getStatus(q) {
      const ans = (state.userAnswers[q.num] || "").toString().trim();
      if (ans === "") return 'empty';
      return ans.toLowerCase() === q.correct.toLowerCase() ? 'correct' : 'wrong';
    }

    function getFilteredQuestions() {
      return QUESTIONS.filter(q => {
        if (state.filter === 'all') return true;
        return getStatus(q) === state.filter;
      });
    }

    function initStepCounts() {
      QUESTIONS.forEach(q => {
        state.visibleStepsCount[q.num] = state.stepMode === 'progressive' ? 1 : q.steps.length;
      });
    }

    function activateReviewMode() {
      stopTimer();
      state.mode = 'review';
      state.showSolutions = true;
      initStepCounts();
      render();
    }

    function activatePracticeMode(withTimer) {
      stopTimer();
      state.mode = withTimer ? 'timer' : 'practice';
      state.userAnswers = {};
      state.showSolutions = false;
      state.filter = 'all';
      state.currentIdx = 0;
      initStepCounts();
      if (withTimer) {
        state.timerSeconds = 25 * 60;
        document.getElementById('timer-box').classList.remove('hidden');
        updateTimerDisplay();
        state.timerInterval = setInterval(() => {
          if (state.timerSeconds > 0) {
            state.timerSeconds--;
            updateTimerDisplay();
          } else {
            stopTimer();
            state.showSolutions = true;
            render();
          }
        }, 1000);
      }
      render();
    }

    function stopTimer() {
      if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
      const tb = document.getElementById('timer-box');
      if (tb) tb.classList.add('hidden');
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(state.timerSeconds / 60)).padStart(2, '0');
      const s = String(state.timerSeconds % 60).padStart(2, '0');
      const el = document.getElementById('timer-display');
      if (el) el.textContent = `${m}:${s}`;
    }

    function setLang(l) { state.lang = l; render(); }
    function setSolTab(t) { state.solTab = t; render(); }
    function setStepMode(sm) { state.stepMode = sm; initStepCounts(); render(); }

    function setFilter(f) {
      state.filter = f;
      const filtered = getFilteredQuestions();
      if (filtered.length > 0) state.currentIdx = QUESTIONS.findIndex(q => q.num === filtered[0].num);
      render();
    }

    function selectQuestion(idx) {
      if (idx < 0 || idx >= QUESTIONS.length) return;
      state.currentIdx = idx;
      render();
    }

    function chooseOption(qNum, label) { state.userAnswers[qNum] = label; render(); }
    function updateEssay(qNum, val) { state.userAnswers[qNum] = val.trim(); updateTopBar(); }
    function toggleGlobalSolutions() { state.showSolutions = !state.showSolutions; render(); }

    function revealNextStep(qNum, maxSteps) {
      const cur = state.visibleStepsCount[qNum] || 1;
      if (cur < maxSteps) { state.visibleStepsCount[qNum] = cur + 1; render(); }
    }
    function revealAllStepsFor(qNum, maxSteps) { state.visibleStepsCount[qNum] = maxSteps; render(); }
    function resetStepsFor(qNum) { state.visibleStepsCount[qNum] = 1; render(); }

    function isCorrect(q) {
      const ans = (state.userAnswers[q.num] || "").toString().trim().toLowerCase();
      if (!ans) return null;
      return ans === q.correct.toLowerCase();
    }

    function updateTopBar() {
      let answered = 0, correct = 0, wrong = 0, empty = 0;
      QUESTIONS.forEach(q => {
        const st = getStatus(q);
        if (st === 'empty') {
          empty++;
        } else {
          answered++;
          if (st === 'correct') correct++;
          else wrong++;
        }
      });

      document.getElementById('stat-answered').textContent = answered;
      document.getElementById('stat-correct').textContent = correct;
      document.getElementById('stat-score').textContent = Math.round((correct / QUESTIONS.length) * 100);

      document.getElementById('filter-all').textContent = `Semua (${QUESTIONS.length})`;
      document.getElementById('filter-wrong').textContent = `❌ Salah (${wrong})`;
      document.getElementById('filter-empty').textContent = `⚪ Kosong (${empty})`;
      document.getElementById('filter-correct').textContent = `✅ Benar (${correct})`;

      const filteredNums = new Set(getFilteredQuestions().map(q => q.num));
      const strip = document.getElementById('palette-strip');
      strip.innerHTML = '';

      QUESTIONS.forEach((q, idx) => {
        const ans = (state.userAnswers[q.num] || "").toString().trim();
        const corr = isCorrect(q);
        const isCurrent = state.currentIdx === idx;
        const inFilter = filteredNums.has(q.num);

        let cls = "w-7 h-7 rounded-md text-xs font-mono font-bold border transition flex items-center justify-center shrink-0 ";
        if (!inFilter) cls += "opacity-25 ";
        if (state.showSolutions && ans !== "") {
          cls += corr ? "bg-[var(--success)] text-white border-transparent " : "bg-[var(--error)] text-white border-transparent ";
        } else if (ans !== "") {
          cls += "bg-[var(--primary)] text-[var(--primary-foreground)] border-transparent ";
        } else {
          cls += "bg-[var(--background)] text-[var(--foreground)] border-[var(--border)] ";
        }
        if (isCurrent) cls += "ring-2 ring-[var(--foreground)] ";

        const btn = document.createElement('button');
        btn.className = cls;
        btn.textContent = q.num;
        btn.onclick = () => selectQuestion(idx);
        strip.appendChild(btn);
        if (isCurrent) {
          setTimeout(() => btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }), 50);
        }
      });
    }

    function renderLeftPanel(q) {
      const userAns = (state.userAnswers[q.num] || "").toString().trim();
      const corr = isCorrect(q);

      const filtered = getFilteredQuestions();
      const posInFiltered = filtered.findIndex(item => item.num === q.num);
      const prevQ = posInFiltered > 0 ? filtered[posInFiltered - 1] : null;
      const nextQ = posInFiltered >= 0 && posInFiltered < filtered.length - 1 ? filtered[posInFiltered + 1] : null;
      const prevIdx = prevQ ? QUESTIONS.findIndex(item => item.num === prevQ.num) : -1;
      const nextIdx = nextQ ? QUESTIONS.findIndex(item => item.num === nextQ.num) : -1;

      let qTextHtml = '';

        qTextHtml += `<p class="text-xs md:text-sm font-medium leading-relaxed whitespace-pre-line">${q.q_id}</p>`;

      if (state.lang === 'en' || state.lang === 'both') {
        qTextHtml += `<p class="text-xs leading-relaxed italic text-[var(--muted-foreground)] whitespace-pre-line ${state.lang === 'both' ? 'pt-1.5 border-t border-[var(--border)]' : ''}">${q.q_en}</p>`;

      let optionsHtml = '';
      if (q.type === 'mchoice') {
        optionsHtml = `<div class="grid grid-cols-2 gap-2">` +

            let badge = "";

            if (state.showSolutions) {

            } else if (isSelected) {

            }

            const txt = state.lang === 'en' ? opt.text_en : opt.text_id;
            return `<button onclick="chooseOption(${q.num}, '${opt.label}')" class="p-2.5 rounded-xl border text-left transition flex items-center gap-2 ${optStyle}">

          ${state.showSolutions ? `<span class="text-xs px-2.5 py-1 rounded-md bg-[var(--success)] text-white font-mono font-bold">Kunci: ${q.correct}</span>` : ''}

        </div>`;
      }

      const mobNav = document.getElementById('mobile-bottom-nav');
      if (mobNav) {
        mobNav.innerHTML = `
          <button onclick="selectQuestion(${prevIdx})" ${prevIdx === -1 ? 'disabled' : ''} class="px-3 py-2 rounded-lg border border-[var(--border)] bg-[var(--background)] text-xs font-bold disabled:opacity-40">← Soal</button>
          <button onclick="toggleGlobalSolutions()" class="px-3 py-2 rounded-lg border border-[var(--primary)] text-[var(--primary)] text-xs font-bold">${state.showSolutions ? '🙈 Tutup Kunci' : '👁️ Lihat Kunci'}</button>
          <button onclick="selectQuestion(${nextIdx})" ${nextIdx === -1 ? 'disabled' : ''} class="px-3 py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold disabled:opacity-40">Soal →</button>
        `;

      return `

            <div class="flex items-center gap-1.5">
              <span class="px-2.5 py-0.5 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold">Soal ${q.num}/20</span>
              <span class="text-xs px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--background)] font-medium text-[var(--primary)] truncate max-w-[180px] sm:max-w-[240px]">${q.topic}</span>

            <div class="text-xs">

            <span class="text-xs font-mono text-[var(--muted-foreground)]">Level: <b>${q.difficulty}</b> • Kunci: <b>${state.showSolutions ? q.correct : '?'}</b></span>

          </div>

      `;

        <div class="flex items-start gap-2 p-2 rounded-lg bg-[var(--background)] border border-[var(--border)]">
          <span class="w-5 h-5 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">${sIdx + 1}</span>
          <p class="text-xs leading-relaxed">${st}</p>
        </div>
      `).join('');

      let stepControls = '';
      if (state.stepMode === 'progressive') {
        stepControls = `
          <div class="flex items-center justify-between gap-2 pt-1">
            <span class="text-xs font-mono text-[var(--muted-foreground)]">Langkah ${shownSteps}/${totalSteps}</span>
            <div class="flex items-center gap-1.5">
              ${shownSteps > 1 ? `<button onclick="resetStepsFor(${q.num})" class="px-2.5 py-1 rounded border border-[var(--border)] bg-[var(--background)] text-xs font-medium">↺ Ulang</button>` : ''}
              ${shownSteps < totalSteps ? `<button onclick="revealNextStep(${q.num}, ${totalSteps})" class="px-3 py-1 rounded bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold">▶ Langkah ${shownSteps + 1}</button>` : ''}
              ${shownSteps < totalSteps ? `<button onclick="revealAllStepsFor(${q.num}, ${totalSteps})" class="px-2.5 py-1 rounded border border-[var(--border)] bg-[var(--background)] text-xs font-medium">Semua</button>` : ''}
            </div>
          </div>
        `;
      }

      let tabBodyHtml = '';
      if (state.solTab === 'all') {
        tabBodyHtml = `
          <div class="space-y-2.5 lg:max-h-[340px] lg:overflow-y-auto pr-1">
            ${q.visualHtml || ''}
            <div class="space-y-1.5">
              <div class="text-xs font-bold text-[var(--primary)]">📝 Langkah Demi Langkah Penyelesaian:</div>
              ${stepsHtml}
              ${stepControls}
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
              <div class="p-2.5 rounded-lg bg-[var(--background)] border border-[var(--primary)] space-y-1">
                <div class="text-xs font-bold text-[var(--primary)]">⚡ Trik Cepat Olimpiade:</div>
                <p class="text-xs leading-relaxed">${q.fastTrick}</p>
              </div>
              <div class="p-2.5 rounded-lg bg-[var(--background)] border border-[var(--border)] space-y-1">
                <div class="text-xs font-bold">⚠️ Jebakan &amp; Kesalahan Umum:</div>
                <p class="text-xs leading-relaxed text-[var(--muted-foreground)]">${q.mistakeAnalysis}</p>
              </div>
            </div>
          </div>
        `;
      } else if (state.solTab === 'steps') {
        tabBodyHtml = `
          <div class="space-y-2.5 lg:max-h-[340px] lg:overflow-y-auto pr-1">
            ${q.visualHtml || ''}
            <div class="space-y-1.5">${stepsHtml}${stepControls}</div>
          </div>
        `;
      } else if (state.solTab === 'concept') {
        tabBodyHtml = `
          <div class="space-y-2.5 lg:max-h-[340px] lg:overflow-y-auto pr-1">
            <div class="p-3 rounded-lg bg-[var(--background)] border border-[var(--border)] space-y-1">
              <div class="text-xs font-bold text-[var(--primary)]">💡 Konsep Dasar &amp; Rumus:</div>
              <p class="text-xs md:text-sm leading-relaxed">${q.concept}</p>
            </div>
            <div class="p-3 rounded-lg bg-[var(--background)] border border-[var(--primary)] space-y-1">
              <div class="text-xs font-bold text-[var(--primary)]">⚡ Trik Cepat Olimpiade (&lt; 30 Detik):</div>
              <p class="text-xs md:text-sm leading-relaxed">${q.fastTrick}</p>
            </div>
            ${q.visualHtml || ''}
          </div>
        `;
      } else if (state.solTab === 'eval') {
        const curAns = (state.userAnswers[q.num] || "").toString().trim();
        tabBodyHtml = `
          <div class="space-y-2.5 lg:max-h-[340px] lg:overflow-y-auto pr-1">
            <div class="grid grid-cols-2 gap-2 font-mono text-xs text-center">
              <div class="p-2.5 rounded-lg bg-[var(--background)] border border-[var(--border)]">
                <div class="text-[var(--muted-foreground)]">Jawaban Anda</div>
                <div class="text-base font-bold mt-0.5">${curAns || '⚪ Kosong'}</div>
              </div>
              <div class="p-2.5 rounded-lg bg-[var(--background)] border border-[var(--success)]">
                <div class="text-[var(--success)]">Kunci Jawaban</div>
                <div class="text-base font-bold text-[var(--success)] mt-0.5">${q.correct} ✓</div>
              </div>
            </div>
            <div class="p-3 rounded-lg bg-[var(--background)] border border-[var(--border)] space-y-1">
              <div class="text-xs font-bold">⚠️ Jebakan Soal &amp; Kesalahan Umum:</div>
              <p class="text-xs md:text-sm leading-relaxed">${q.mistakeAnalysis}</p>
            </div>
          </div>
        `;
      }

      return `
        <div class="space-y-2.5">
          <div class="flex flex-wrap items-center justify-between gap-1.5 pb-2 border-b border-[var(--border)]">
            <div class="inline-flex rounded-lg border border-[var(--border)] p-0.5 bg-[var(--background)] text-xs overflow-x-auto no-scrollbar">
              <button onclick="setSolTab('all')" class="px-2 py-1 rounded font-medium transition ${state.solTab === 'all' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'}">📑 Lengkap</button>
              <button onclick="setSolTab('steps')" class="px-2 py-1 rounded font-medium transition ${state.solTab === 'steps' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'}">📝 Langkah (${totalSteps})</button>
              <button onclick="setSolTab('concept')" class="px-2 py-1 rounded font-medium transition ${state.solTab === 'concept' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'}">💡 Konsep &amp; Trik</button>
              <button onclick="setSolTab('eval')" class="px-2 py-1 rounded font-medium transition ${state.solTab === 'eval' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'}">⚠️ Jebakan</button>
            </div>

            <div class="inline-flex rounded-lg border border-[var(--border)] p-0.5 bg-[var(--background)] text-xs">
              <button onclick="setStepMode('all')" class="px-2 py-1 rounded font-medium transition ${state.stepMode === 'all' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'}">Semua</button>
              <button onclick="setStepMode('progressive')" class="px-2 py-1 rounded font-medium transition ${state.stepMode === 'progressive' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'}">▶️ Bertahap</button>
            </div>
          </div>
          ${tabBodyHtml}
        </div>

        <div class="pt-2 border-t border-[var(--border)] flex items-center justify-between text-xs text-[var(--muted-foreground)]">
          <span>💡 Geser nomor di atas untuk lompat ke soal lain</span>
          <span class="font-mono font-bold text-[var(--success)]">Kunci: ${q.correct}</span>
        </div>
      `;
    }

    function render() {
      ['id', 'en', 'both'].forEach(l => {
        const b = document.getElementById('btn-lang-' + l);
        if (b) b.className = "px-2 py-1 rounded font-medium transition " + (state.lang === l ? "bg-[var(--primary)] text-[var(--primary-foreground)]" : "text-[var(--muted-foreground)]");
      });
      ['review', 'practice', 'timer'].forEach(md => {
        const b = document.getElementById('mode-' + md);
        if (b) b.className = "px-2 py-1 rounded font-medium transition " + (state.mode === md ? "bg-[var(--primary)] text-[var(--primary-foreground)]" : "text-[var(--muted-foreground)]");
      });
      ['all', 'wrong', 'empty', 'correct'].forEach(f => {
        const b = document.getElementById('filter-' + f);
        if (b) b.className = "px-2 py-1 rounded font-medium transition " + (state.filter === f ? "bg-[var(--primary)] text-[var(--primary-foreground)]" : "text-[var(--muted-foreground)]");
      });
      ['split', 'question', 'solution'].forEach(mv => {
        const b = document.getElementById('mobview-' + mv);
        if (b) b.className = "flex-1 py-1.5 rounded-lg font-semibold text-center transition " + (state.mobileView === mv ? "bg-[var(--primary)] text-[var(--primary-foreground)]" : "bg-[var(--background)] text-[var(--muted-foreground)] border border-[var(--border)]");
      });

      updateTopBar();

      const q = QUESTIONS[state.currentIdx];
      const leftEl = document.getElementById('left-question-panel');
      const rightEl = document.getElementById('right-solution-panel');

      leftEl.innerHTML = renderLeftPanel(q);
      rightEl.innerHTML = renderRightPanel(q);

      leftEl.className = `lg:col-span-5 bg-[var(--card)] border border-[var(--border)] rounded-xl p-3 md:p-3.5 flex-col justify-between gap-2.5 shadow-sm ${state.mobileView === 'solution' ? 'hidden lg:flex' : 'flex'}`;
      rightEl.className = `lg:col-span-7 bg-[var(--card)] border border-[var(--border)] rounded-xl p-3 md:p-3.5 flex-col justify-between gap-2.5 shadow-sm ${state.mobileView === 'question' ? 'hidden lg:flex' : 'flex'}`;
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      const filtered = getFilteredQuestions();
      const pos = filtered.findIndex(item => item.num === QUESTIONS[state.currentIdx].num);
      if (e.key === 'ArrowRight' && pos >= 0 && pos < filtered.length - 1) {
        selectQuestion(QUESTIONS.findIndex(item => item.num === filtered[pos + 1].num));
      } else if (e.key === 'ArrowLeft' && pos > 0) {
        selectQuestion(QUESTIONS.findIndex(item => item.num === filtered[pos - 1].num));
      }
    });

    activateReviewMode();
  </script>
</body>
</html>
